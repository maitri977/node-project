<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Conversion Result</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>✅ Conversion Result</h1>

      <div class="box">
        <div class="line"><span>From:</span> <b>{{FROM}}</b></div>
        <div class="line"><span>To:</span> <b>{{TO}}</b></div>
        <div class="line"><span>Amount:</span> <b>{{AMOUNT}} {{FROM}}</b></div>
        <div class="line"><span>Rate:</span> <b>1 {{FROM}} = {{RATE}} {{TO}}</b></div>
        <div class="line big"><span>Converted:</span> <b>{{CONVERTED}} {{TO}}</b></div>
        <div class="line small"><span>Rates date:</span> <b>{{DATE}}</b></div>
      </div>

      <a class="link" href="/">⬅ Check another</a>
    </div>
  </div>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Currency Rate Checker</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>💱 Currency Rate Checker</h1>
      <p class="sub">Fetches live exchange rates (Frankfurter / ECB).</p>

      <form method="POST" action="/convert" class="form">
        <div class="row">
          <div class="field">
            <label>From</label>
            <select name="from" required>
              {{FROM_OPTIONS}}
            </select>
          </div>

          <div class="field">
            <label>To</label>
            <select name="to" required>
              {{TO_OPTIONS}}
            </select>
          </div>
        </div>

        <div class="field">
          <label>Amount</label>
          <input name="amount" type="number" min="0.01" step="0.01" placeholder="e.g. 100" required>
        </div>

        <button type="submit">Check Rate ✨</button>
      </form>

      <p class="tiny">Tip: Try CAD → USD, USD → INR, EUR → CAD.</p>
    </div>
  </div>
</body>
</html>
